<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--wire:#86868b;--accent:#0071e3}
body{margin:0;background:#fff}
svg.figure{display:block;width:100%;height:auto;max-width:1388px;margin:auto}
text{font-family:Inter,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.title{font-size:16px;font-weight:600;letter-spacing:-.2px}
.subtitle{font-size:13px;fill:var(--muted)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.06em;fill:var(--muted)}
.node{font-size:14px;font-weight:500}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:15px}
.chip{font-size:12px;fill:#3a3a3c}
.wire-label{font-size:12px;fill:var(--muted);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.mono{font-family:"JetBrains Mono","SF Mono",Menlo,monospace;font-size:13px;fill:#3a3a3c}
.wire{fill:none;stroke:var(--wire);stroke-width:1.25;stroke-linecap:round}
.wire.accent{stroke:var(--accent)}
</style>

const width=el=>el.tagName==='text'?el.getComputedTextLength():+el.getAttribute('width');
// Place each icon and label in a row, centred on data-cx or starting at data-x.
function layoutInline(){
  for(const group of document.querySelectorAll('.inline')){
    const items=[...group.children],cy=+group.dataset.cy;
    const gaps=items.map((el,i)=>i?+(el.dataset.gap||8):0);
    const total=items.reduce((sum,el,i)=>sum+width(el)+gaps[i],0);
    let x=group.dataset.x!==undefined?+group.dataset.x:+group.dataset.cx-total/2;
    items.forEach((el,i)=>{
      x+=gaps[i];
      if(el.tagName==='text'){el.setAttribute('x',x);el.setAttribute('y',cy+(el.classList.contains('eyebrow')?4:5));}
      else{el.setAttribute('x',x);el.setAttribute('y',cy-width(el)/2);}
      x+=width(el);
    });
  }
}

    let x=+group.dataset.x;const y=+group.dataset.y;
    for(const entry of labels){
      const [icon,label]=entry.includes(':')?entry.split(':'):[null,entry];
      const rect=document.createElementNS(NS,'rect');group.appendChild(rect);
      let textX=x+9;
      if(icon){
        const use=document.createElementNS(NS,'use');
        Object.entries({href:'#'+icon,x:x+8,y:y+6,width:14,height:14}).forEach(([k,v])=>use.setAttribute(k,v));
        group.appendChild(use);textX=x+27;
      }
      const text=document.createElementNS(NS,'text');
      text.setAttribute('class','chip');text.setAttribute('x',textX);text.setAttribute('y',y+17);text.textContent=label;
      group.appendChild(text);
      const w=textX-x+text.getComputedTextLength()+9;
      Object.entries({x,y,width:w,height:26,rx:7,fill:'#f5f5f7'}).forEach(([k,v])=>rect.setAttribute(k,v));
      x+=w+6;
    }
  }
}
document.fonts.ready.then(()=>{layoutInline();layoutChips();});
</script>
</body>
</html>
